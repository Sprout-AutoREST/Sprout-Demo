spring.application.name=Sprout-Demo

spring.datasource.url=jdbc:h2:mem:sproutdemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2
logging.level.de.flix29=INFO

sprout.errors.enabled=true
sprout.errors.log-stacktraces=false
sprout.errors.internal-code=internal_error