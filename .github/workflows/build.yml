name: Maven CI/CD

on: [ push, pull_request ]

jobs:
  build_and_test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Sprout-Demo
        uses: actions/checkout@v4

      - name: Checkout Sprout
        uses: actions/checkout@v4
        with:
          repository: flix-29/sprout
          path: sprout-src
          ref: main
          token: ${{ secrets.SPROUT_READ_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & install Sprout
        working-directory: sprout-src
        run: |
          mvn -U -DskipTests install

      - name: Read Sprout version
        id: ver
        working-directory: sprout-src/sprout-annotations
        run: |
          V=$(mvn -q -DforceStdout -Dexpression=project.version help:evaluate)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build demo
        env:
          SPROUT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "Using Sprout version: ${SPROUT_VERSION}"
          mvn -B -U -Dsprout.version="${SPROUT_VERSION}" clean verify
