name: Maven CI/CD

on: [ push, pull_request ]

jobs:
  build_and_test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build project with Maven
        run: mvn -B -U clean verify